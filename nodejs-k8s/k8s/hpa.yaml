apiVersion: autoscaling/v2 
kind : HorizontalPodAutoscaler
metadata:
  name: crud-app
  namespace: crud 
spec:
  scaleTargetRef:
    apiVersion: apps/v1 
    kind: Deployment 
    name: crud-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource 
      resource:
        name: cpu 
        target: 
          type: Utilization
          averageUtilization: 60
---