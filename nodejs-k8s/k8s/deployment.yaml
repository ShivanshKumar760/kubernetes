apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: crud-app 
  namespace: crud 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crud-app
  template:
    metadata:
      labels:
        app: crud-app
    spec:
      containers:
        - name: api
          image: youruser/crud-app:1.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: app-secret
          resources:
            requests: {cpu: 100m , memory: 128Mi}
            limits: {cpu: 500m , memory: 256Mi}
          readinessPorbe:
            httpGet: {path: /health , port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health , port: 3000}
            initialDelaySeconds: 15

---
apiVersion: v1 
kind: Service 
metadata:
  name: crud-app 
  namespace: crud 
spec: 
  type: NodePort
  selector:
    app: crud-app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080